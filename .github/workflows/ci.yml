name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node:
    name: Node (lint + typecheck + build)
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust (for wasm-pack)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo (wasm-pack build)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build wasm artifact (gates typecheck for downstream packages)
        run: pnpm --filter @opfs/core-wasm build

      - name: Lint (biome)
        run: pnpm check

      - name: Typecheck (all workspaces)
        run: pnpm -r typecheck

      - name: Build (turbo)
        run: pnpm build

  cargo:
    name: Cargo (build + test + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build leaf crates for wasm32-unknown-unknown
        run: cargo build -p opfs-crypto -p opfs-share-protocol --target wasm32-unknown-unknown --locked

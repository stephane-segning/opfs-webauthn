name: Deploy share backend (Rust / Knative)

# Builds the Rust rendezvous backend container, pushes it to GHCR,
# and applies the Knative `Service` manifest (ADR 0012).
#
# Repository setup (one-time):
#   1. Grant the workflow `packages: write` so it can publish to
#      GHCR — done in `permissions:` below.
#   2. Add `KUBE_CONFIG` as a repository secret: base64-encoded
#      kubeconfig with permission to manage the
#      `serving.knative.dev/v1` `Service` in the target namespace.
#      `cat ~/.kube/config | base64 -w0`.
#   3. (Optional) `KNATIVE_NAMESPACE` as a repository variable; the
#      manifest defaults to `default`.
#
# When `KUBE_CONFIG` is unset the workflow short-circuits with a
# notice rather than failing — keeps fork CI green.

on:
  push:
    branches: [main]
    paths:
      - "apps/share-backend-rs/**"
      - "crates/crypto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-share-backend-rs.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-share-backend-rs
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/opfs-share-backend

jobs:
  deploy:
    name: build → push → apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::notice::KUBE_CONFIG not set — skipping Knative deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.creds.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.creds.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image
        if: steps.creds.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/share-backend-rs/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install kubectl
        if: steps.creds.outputs.ready == 'true'
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        if: steps.creds.outputs.ready == 'true'
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Render manifest with the just-pushed tag
        if: steps.creds.outputs.ready == 'true'
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # CORS allow-list. Defaults to the production UI host;
          # override per repo (or per environment) via the
          # `ALLOWED_ORIGINS` repository variable.
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'https://ocs.vaam.store' }}
        run: |
          # `envsubst` would also work; sed keeps the toolchain to
          # what `azure/setup-kubectl` already provisions.
          sed \
            -e "s|\${IMAGE}|${IMAGE}|g" \
            -e "s|\${ALLOWED_ORIGINS}|${ALLOWED_ORIGINS}|g" \
            apps/share-backend-rs/k8s/service.yaml > /tmp/service.rendered.yaml
          echo "::group::Rendered manifest"
          cat /tmp/service.rendered.yaml
          echo "::endgroup::"

      - name: Apply Knative Service
        if: steps.creds.outputs.ready == 'true'
        env:
          NAMESPACE: ${{ vars.KNATIVE_NAMESPACE || 'default' }}
        run: kubectl apply -n "${NAMESPACE}" -f /tmp/service.rendered.yaml

      - name: Wait for rollout
        if: steps.creds.outputs.ready == 'true'
        env:
          NAMESPACE: ${{ vars.KNATIVE_NAMESPACE || 'default' }}
        run: |
          # Block until Knative reports `Ready=True`. Surfaces image
          # pull / config errors as a workflow failure instead of
          # leaving the job green while the service stays broken.
          kubectl wait \
            --namespace "${NAMESPACE}" \
            --for=condition=Ready \
            --timeout=180s \
            ksvc/opfs-share-backend

name: Build + sign share-backend image

# Builds the Rust rendezvous backend container (ADR 0012), signs
# it with `cosign` keyless / Sigstore, and pushes both `:latest`
# and `:<sha>` tags to GHCR. **No cluster apply.** Deploys are
# driven by ArgoCD reconciling the manifest under
# `apps/share-backend/k8s/`; the workflow's job is only to publish
# a verified image artifact ArgoCD can pick up.
#
# Signing uses Sigstore's keyless flow — the GH Actions OIDC token
# is exchanged for a short-lived signing cert via Fulcio, and the
# signature lands in the Rekor transparency log. No private key
# material to manage.

on:
  push:
    branches: [main]
    paths:
      - "apps/share-backend/**"
      - "crates/crypto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-share-backend.yml"
  pull_request:
    paths:
      - "apps/share-backend/**"
      - "crates/crypto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-share-backend.yml"
  workflow_dispatch:

# `id-token: write` is required for cosign keyless signing —
# Sigstore exchanges that OIDC token for a Fulcio cert.
permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-share-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/opfs-share-backend

jobs:
  build:
    name: build (+ sign on main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On PRs we build to catch Dockerfile regressions but don't
      # push — there's no need to clutter GHCR with a tag per PR.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR sanity-check, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/share-backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push image
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/share-backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Persist the image manifest digest so cosign can sign by
          # digest rather than tag (tags are mutable, digests are
          # not).
          provenance: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign image (keyless via Sigstore)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # `cosign sign --yes` is non-interactive; the OIDC token
          # comes from the workflow's `id-token: write` permission.
          # Signing the digest (not a tag) means the signature is
          # bound to the exact bytes ArgoCD will pull.
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_NAME}@${DIGEST}"

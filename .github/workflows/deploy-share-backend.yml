name: Build + sign share-backend image and chart

# Builds the Rust rendezvous backend container (ADR 0012), packages
# the deploy Helm chart, signs both with `cosign` keyless / Sigstore,
# and pushes the image + chart to GHCR. **No cluster apply.**
# Deploys are driven by ArgoCD pulling the OCI Helm chart and the
# signed image.
#
# Signing uses Sigstore's keyless flow — the GH Actions OIDC token
# is exchanged for a short-lived signing cert via Fulcio, and the
# signature lands in the Rekor transparency log. No private key
# material to manage.

on:
  push:
    branches: [main]
    paths:
      - "apps/share-backend/**"
      - "crates/crypto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-share-backend.yml"
  pull_request:
    paths:
      - "apps/share-backend/**"
      - "crates/crypto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-share-backend.yml"
  workflow_dispatch:

# `id-token: write` is required for cosign keyless signing —
# Sigstore exchanges that OIDC token for a Fulcio cert.
permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-share-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/opfs-share-backend
  # Chart published alongside the image, under `/charts/` to keep
  # the OCI namespace tidy. ArgoCD `Application` sources point at
  # `oci://${CHART_REPO}` with `chart: opfs-share-backend`.
  CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
  CHART_NAME: opfs-share-backend
  CHART_PATH: apps/share-backend/helm/opfs-share-backend

jobs:
  build-image:
    name: build image (+ sign on main)
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        # Single source of truth for the image tag AND the chart's
        # `appVersion`. The chart helper resolves `image.tag` to
        # `.Chart.AppVersion` by default, which the publish-chart
        # job rewrites to this same short SHA — keeping them in
        # lockstep means a fresh `helm install` lands on an image
        # that actually exists.
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On PRs we build to catch Dockerfile regressions but don't
      # push — there's no need to clutter GHCR with a tag per PR.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR sanity-check, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/share-backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push image
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/share-backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Persist the image manifest digest so cosign can sign by
          # digest rather than tag (tags are mutable, digests are
          # not).
          provenance: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign image (keyless via Sigstore)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # `cosign sign --yes` is non-interactive; the OIDC token
          # comes from the workflow's `id-token: write` permission.
          # Signing the digest (not a tag) means the signature is
          # bound to the exact bytes ArgoCD will pull.
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_NAME}@${DIGEST}"

  publish-chart:
    name: package + sign Helm chart
    runs-on: ubuntu-latest
    # Run the chart pipeline after the image so the chart can never
    # advertise a digest the image build hasn't actually produced.
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint chart
        run: helm lint "${CHART_PATH}"

      - name: Render chart (sanity-check templating)
        run: |
          # `helm template` exits non-zero on a broken template; runs
          # on every PR too, so a regression on the chart fails fast.
          helm template release "${CHART_PATH}" --namespace opfs > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
          echo "::group::Rendered manifest"
          cat /tmp/rendered.yaml
          echo "::endgroup::"

      - name: Bump chart version + appVersion
        if: github.event_name != 'pull_request'
        id: chart
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          # OCI Helm uses `Chart.yaml` `version` as the immutable
          # registry tag, so we cannot publish a fixed `0.1.0` every
          # push (registries either reject the second push or
          # silently overwrite, breaking `targetRevision: 0.1.0`
          # consumers).
          #
          # `version` becomes `${BASE}.${run_number}` — monotonic and
          # unique per workflow run; `appVersion` becomes the short
          # commit SHA, so the chart helper resolves the image tag
          # to a real `:<short-sha>` that the build job pushed in
          # this same run.
          base=$(awk '/^version:/ { print $2 }' "${CHART_PATH}/Chart.yaml")
          # Strip any pre-existing pre-release/build suffix; we want
          # `MAJOR.MINOR` only as the base, then append run number.
          base_majmin=$(echo "${base}" | awk -F. '{ print $1"."$2 }')
          version="${base_majmin}.${RUN_NUMBER}"
          app_version="${SHA:0:7}"

          # Rewrite `Chart.yaml` in-place. `ubuntu-latest` ships GNU
          # sed; the `-E` flag keeps the regex modern and the
          # anchored `^…:` ensures we touch only the top-level keys.
          sed -i -E "s|^version:.*$|version: ${version}|" "${CHART_PATH}/Chart.yaml"
          sed -i -E "s|^appVersion:.*$|appVersion: \"${app_version}\"|" "${CHART_PATH}/Chart.yaml"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "appVersion=${app_version}" >> "$GITHUB_OUTPUT"
          echo "::group::Rewritten Chart.yaml"
          cat "${CHART_PATH}/Chart.yaml"
          echo "::endgroup::"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: |
          # `helm registry login` reads from stdin; the same
          # GITHUB_TOKEN that auths the image push works here.
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Package + push chart
        if: github.event_name != 'pull_request'
        id: push
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          helm package "${CHART_PATH}" --destination /tmp
          # Capture the OCI digest from `helm push` output so cosign
          # can sign the immutable chart artifact, not the version
          # tag (versions can be overwritten on the registry).
          push_output=$(helm push "/tmp/${CHART_NAME}-${VERSION}.tgz" "oci://${CHART_REPO}" 2>&1 | tee /dev/stderr)
          digest=$(echo "${push_output}" | awk -F': ' '/Digest:/ { print $2 }')
          if [ -z "${digest}" ]; then
            echo "::error::could not parse digest from helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Sign chart (keyless via Sigstore)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # The OCI artifact for the chart lives at the same path the
          # `helm install oci://…` command pulls from, just signed
          # by digest. ArgoCD's verification can then check the
          # digest before sync.
          cosign sign --yes "${CHART_REPO}/${CHART_NAME}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${CHART_REPO}/${CHART_NAME}@${DIGEST}"

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment; let the latest queued run win
# without cancelling the in-progress one (so we never serve a half-built
# page on Pages).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      # Switch on the static-export branch of apps/web/next.config.js.
      NEXT_OUTPUT_EXPORT: "1"
      # The app is now served from the apex of a custom domain
      # (`ocs.vaam.store` per the CNAME file in apps/web/public/), so
      # `basePath` is empty. The variable is read by next.config.js;
      # an unset value collapses to "" and Next.js drops the prefix.
      # If we ever re-host on a project URL, re-add it here.
      # Optional: if the share backend (ADR 0007 / 0012) has been
      # deployed and its URL is set as the
      # `NEXT_PUBLIC_SHARE_BACKEND_URL` repository variable, the
      # static build wires the share UI to it. Leaving the variable
      # unset hides the share affordances entirely — there's no
      # runtime branch to test.
      NEXT_PUBLIC_SHARE_BACKEND_URL: ${{ vars.NEXT_PUBLIC_SHARE_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust (for wasm-pack)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo (wasm-pack build)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      # The next step runs `next build` directly via the
      # `@opfs/web#build` script — that bypasses Turbo, so the wasm
      # artifact `packages/core-wasm/dist/opfs_core.js` is not built
      # transitively. Build it explicitly first; matches what ci.yml
      # already does before its typecheck step.
      - name: Build wasm artifact (gates the static export)
        run: pnpm --filter @opfs/core-wasm build

      - name: Build static export
        run: pnpm --filter @opfs/web build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

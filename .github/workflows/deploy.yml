name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment; let the latest queued run win
# without cancelling the in-progress one (so we never serve a half-built
# page on Pages).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      # Switch on the static-export branch of apps/web/next.config.js.
      NEXT_OUTPUT_EXPORT: "1"
      # Pages serves this app under a project URL (e.g. /opfs-webauthn);
      # apps/web reads this to set basePath + assetPrefix.
      NEXT_PUBLIC_BASE_PATH: /opfs-webauthn
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust (for wasm-pack)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo (wasm-pack build)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build static export (Turbo also runs @opfs/core-wasm#build)
        run: pnpm --filter @opfs/web build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

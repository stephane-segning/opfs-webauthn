[package]
name = "opfs-share-backend"
description = "Self-hosted Rust HTTP backend for the recipient-first share rendezvous. Deployed on Knative (ADR 0012)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "opfs-share-backend"
path = "src/main.rs"

[lib]
name = "opfs_share_backend"
path = "src/lib.rs"

[dependencies]
# Reuse the same commitment derivation the wasm side uses — the JS
# port pins this crate's output as a reference vector, so the two
# sides cannot drift.
opfs-crypto = { path = "../../crates/crypto" }

axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "matched-path", "tracing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
serde = { workspace = true, features = ["std"] }
serde_json = "1"
# Re-enable thiserror's std feature so `#[derive(Error)]` plays
# nicely with axum's `IntoResponse`. The workspace default keeps it
# off for the no_std crates.
thiserror = { workspace = true, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[dev-dependencies]
hex = { workspace = true }

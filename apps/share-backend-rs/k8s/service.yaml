# Knative `Service` for opfs-share-backend (ADR 0012).
#
# Single-replica scaling so the in-memory `RendezvousStore` stays
# correct. When traffic grows enough to warrant >1 pod, swap the
# store impl to Redis behind the same `RendezvousStore` trait and
# bump `maxScale`.
#
# The CI workflow substitutes `${IMAGE}` for the just-pushed tag
# before `kubectl apply`. Everything else is committed verbatim so
# the manifest is reviewable on its own.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: opfs-share-backend
  namespace: default
  labels:
    app.kubernetes.io/name: opfs-share-backend
    app.kubernetes.io/component: rendezvous-api
spec:
  template:
    metadata:
      annotations:
        # Pin the replica count: the in-memory store is per-pod.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        # The default ingress class; override if the cluster uses
        # something different.
        networking.knative.dev/ingress-class: istio.ingress.networking.knative.dev
    spec:
      # Concurrency is bounded so a single pod doesn't fall over
      # under burst — well above expected research traffic.
      containerConcurrency: 100
      timeoutSeconds: 30
      containers:
        - name: opfs-share-backend
          image: ${IMAGE}
          imagePullPolicy: Always
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: ALLOWED_ORIGINS
              value: "https://ocs.vaam.store"
            # `x-real-ip` is what Knative's Istio ingress sets to the
            # immediate peer's IP. See the README + ADR 0011 for why
            # we never read `X-Forwarded-For` directly.
            - name: TRUSTED_IP_HEADER
              value: "x-real-ip"
            - name: RUST_LOG
              value: "info,opfs_share_backend=debug"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          # The binary is read-only; deny escalation explicitly even
          # though the distroless image already runs as `nonroot`.
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

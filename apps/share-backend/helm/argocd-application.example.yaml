# Example ArgoCD `Application` consuming the opfs-share-backend
# Helm chart from GHCR OCI.
#
# **Not applied by this repo.** Lives in the user's ArgoCD apps
# repo / install. Committed here so the deploy pattern is
# reviewable alongside the chart it consumes.
#
# What this sets up:
#
# 1. `source.repoURL` + `source.chart` point at the Helm chart
#    published as an OCI artifact by the build workflow. ArgoCD
#    supports OCI Helm sources natively as of v2.7; cluster must
#    be on a recent enough version.
#
# 2. `source.helm.values` overrides per-env knobs (CORS origins,
#    image tag pin, etc.). The chart's defaults are the production
#    values; staging / preview envs would shrink the allow-list
#    and pin specific image tags here.
#
# 3. Image Updater watches the `:latest` container tag in GHCR
#    and, via `digest` strategy, commits the matching digest back
#    into the chart's `image.tag` value. The keyless cosign
#    verification annotations require each promoted digest to
#    carry a Sigstore signature issued by THIS repo's deploy
#    workflow — a leaked GHCR token alone cannot push an image
#    that passes the check.
#
# 4. Cluster-side admission enforcement is **strongly recommended**
#    as belt-and-suspenders: install Sigstore's
#    `policy-controller` (or kyverno-sigstore) and apply a
#    `ClusterImagePolicy` mirroring the same identity match. The
#    Updater gates the update *path*; the policy controller gates
#    the *runtime*.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opfs-share-backend
  namespace: argocd
  annotations:
    # Track the mutable `:latest` container tag explicitly; the
    # `digest` strategy then resolves to an immutable digest pin.
    argocd-image-updater.argoproj.io/image-list: >-
      backend=ghcr.io/stephane-segning/opfs-share-backend:latest
    argocd-image-updater.argoproj.io/backend.update-strategy: digest
    # Map the resolved digest into the chart's `image.tag` value
    # via Helm — chart-aware write-back instead of Kustomize.
    argocd-image-updater.argoproj.io/backend.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/backend.helm.image-tag: image.tag

    # Sigstore keyless verification. Image Updater refuses to
    # promote a digest that wasn't signed by THIS repo's deploy
    # workflow on `main`.
    argocd-image-updater.argoproj.io/backend.signature-type: cosign
    argocd-image-updater.argoproj.io/backend.cosign.certificate-oidc-issuer: >-
      https://token.actions.githubusercontent.com
    argocd-image-updater.argoproj.io/backend.cosign.certificate-identity-regexp: >-
      ^https://github\.com/stephane-segning/opfs-webauthn/\.github/workflows/deploy-share-backend\.yml@.*$

    # Persist digest pins to Git. ArgoCD Image Updater's `git`
    # write-back mode clones `.spec.source.repoURL` by default —
    # but that field here is an OCI Helm registry, which is not a
    # Git URL. So we MUST set `git-repository` (and the matching
    # `write-back-target`) explicitly; without it the updater logs
    # "source is not a Git repository" and digest pins never land
    # in source control.
    #
    # Point this at the apps/GitOps repo that holds the per-env
    # values overlay this `Application` reads from. The example
    # uses a sibling repo and writes to
    # `envs/production/opfs-share-backend.values.yaml` — adjust
    # for your layout.
    #
    # `git-credentials` reuses the same GitHub App secret ArgoCD
    # itself authenticates with — the
    # `argocd.argoproj.io/secret-type: repo-creds` label tells
    # both controllers to pick it up, so one App installation
    # serves source-fetch AND digest write-back. The App must
    # have `Contents: read & write` on the GitOps repo for the
    # push to succeed.
    #
    # `git-repository` MUST be HTTPS, not SSH — GitHub App auth
    # mints short-lived installation tokens used as HTTPS
    # basic-auth; SSH bypasses that entirely.
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/git-repository: >-
      https://github.com/stephane-segning/opfs-webauthn-gitops.git
    argocd-image-updater.argoproj.io/write-back-target: >-
      helmvalues:envs/production/opfs-share-backend.values.yaml
    argocd-image-updater.argoproj.io/git-credentials: >-
      secret:argocd/github-app-creds--stephane-segning
spec:
  project: default
  source:
    # OCI Helm chart. ArgoCD pulls + renders the chart on each
    # sync; cluster never has direct Git access to the source
    # repo (it doesn't need it — the chart artifact is the
    # release boundary).
    repoURL: ghcr.io/stephane-segning/charts
    chart: opfs-share-backend
    # Pick a real published version. The build workflow rewrites
    # `Chart.yaml` `version` to `0.1.<run_number>` on every push to
    # main, so the registry has `0.1.42`, `0.1.43`, … — never the
    # `0.1.0` placeholder that's in the source tree.
    targetRevision: 0.1.*
    helm:
      # **Must be set per cluster.** The chart default for
      # `allowedOrigins` is `""`, which the CORS middleware
      # treats as "reject every Origin'd request" — surfaces
      # misconfiguration loudly instead of letting requests
      # silently fail. Point this at the frontend's
      # Knative-assigned URL (`opfs-web.<ns>.<config-domain>`).
      # Comma-separate for preview / staging environments.
      values: |
        env:
          allowedOrigins: https://opfs-web.opfs.example.com
  destination:
    server: https://kubernetes.default.svc
    namespace: opfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

# Knative `Service` for opfs-share-backend (ADR 0012).
#
# Single-replica scaling so the in-memory `RendezvousStore` stays
# correct. When traffic grows enough to warrant >1 pod, swap the
# store impl to Redis behind the same `RendezvousStore` trait and
# bump `maxScale`.
#
# Deploy model is GitOps via ArgoCD — the manifest is applied
# verbatim from this path, no CI-side substitution. Image tag
# pinned to `:latest`; production rollouts use ArgoCD Image
# Updater (or an equivalent overlay) to pin specific signed
# digests as they arrive in GHCR. The Image Updater annotations
# live on the ArgoCD `Application` (not here) so this manifest
# stays portable across environments.
#
# Namespace is intentionally omitted; the ArgoCD `Application`
# sets `destination.namespace`. That keeps this manifest portable
# across environments.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: opfs-share-backend
  labels:
    app.kubernetes.io/name: opfs-share-backend
    app.kubernetes.io/component: rendezvous-api
spec:
  template:
    metadata:
      annotations:
        # Pin the replica count: the in-memory store is per-pod.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        # Ingress class intentionally not pinned. The cluster's
        # Knative `config-network` configmap chooses the default
        # (Istio / Kourier / Contour / …); hardcoding one here
        # would deadlock `kubectl wait` on clusters that use a
        # different ingress. Override per-Service via this
        # annotation if a deployment really needs a specific one.
    spec:
      # Concurrency is bounded so a single pod doesn't fall over
      # under burst — well above expected research traffic.
      containerConcurrency: 100
      timeoutSeconds: 30
      containers:
        - name: opfs-share-backend
          # Pinned to `:latest` here; the Image Updater on the
          # ArgoCD `Application` rewrites this to the signed
          # digest published by the build workflow on every push
          # to `main`.
          #
          # The owner segment matches this repository's GHCR
          # namespace (codex flagged that this hardcodes
          # `stephane-segning`). Forks / org migrations should
          # override the image reference in a per-environment
          # Kustomize overlay rather than editing the base — the
          # `kustomization.yaml` sibling exposes the
          # `images: [name: <ref>, newName: <override>]` knob for
          # exactly that.
          image: ghcr.io/stephane-segning/opfs-share-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: ALLOWED_ORIGINS
              # Override per environment via a Kustomize patch on
              # the ArgoCD `Application`. Default is the production
              # frontend so the manifest applies cleanly without
              # any overlay.
              value: "https://ocs.vaam.store"
            # `x-real-ip` is what Knative's Istio ingress sets to the
            # immediate peer's IP. See the README + ADR 0011 for why
            # we never read `X-Forwarded-For` directly.
            - name: TRUSTED_IP_HEADER
              value: "x-real-ip"
            - name: RUST_LOG
              value: "info,opfs_share_backend=debug"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          # The binary is read-only; deny escalation explicitly even
          # though the distroless image already runs as `nonroot`.
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

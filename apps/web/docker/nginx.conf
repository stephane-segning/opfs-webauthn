# nginx config for opfs-web (ADR 0013).
#
# Two responsibilities:
#   1. Serve the Next.js static export.
#   2. Emit the COOP / COEP / CORP headers that put the document
#      into a `crossOriginIsolated` context — without those,
#      sqlite-wasm can't fall back to the async OPFS VFS and the
#      browser refuses to expose `SharedArrayBuffer`.
#
# Headers are repeated in inner `location` blocks because nginx's
# `add_header` directive doesn't inherit when an inner block
# defines its own. The `always` flag emits them for non-2xx
# responses too — 404s for missing assets still need to be
# cross-origin-isolation-compatible.

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Cross-origin isolation. `credentialless` is the same
    # isolation outcome as `require-corp` but doesn't force
    # every cross-origin asset to ship `Cross-Origin-Resource-Policy`
    # headers — the `fetch` calls to `api.ocs.vaam.store` are
    # uncredentialed so this works for us.
    add_header Cross-Origin-Opener-Policy   "same-origin"     always;
    add_header Cross-Origin-Embedder-Policy "credentialless"  always;
    add_header Cross-Origin-Resource-Policy "same-origin"     always;

    # Defensive baseline. Tighten further behind the ingress with
    # CSP if the cluster supports it.
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Compression. Static export is tiny; brotli would be nicer but
    # the unprivileged image doesn't ship `ngx_brotli`.
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # `.wasm` MIME is `application/wasm` per the inherited
    # `/etc/nginx/mime.types` from nginx ≥ 1.21. We deliberately
    # **don't** redeclare a `types { … }` block at the server
    # level — nginx treats it as a replacement (not a merge), so
    # an inline block here would drop HTML / CSS / JS MIME
    # entries and our HTML responses would default to
    # `application/octet-stream`.

    # Long-immutable cache for hashed Next.js assets.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control                "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"                          always;
        add_header Cross-Origin-Embedder-Policy "credentialless"                       always;
        add_header Cross-Origin-Resource-Policy "same-origin"                          always;
        add_header X-Content-Type-Options       "nosniff"                              always;
        try_files $uri =404;
    }

    # Service worker must not be cached — a stale `sw.js` would
    # pin users to an old build.
    location = /sw.js {
        add_header Cache-Control                "no-store"        always;
        add_header Cross-Origin-Opener-Policy   "same-origin"     always;
        add_header Cross-Origin-Embedder-Policy "credentialless"  always;
        add_header Cross-Origin-Resource-Policy "same-origin"     always;
        try_files $uri =404;
    }

    # PWA manifest + iconset — short cache, occasional refresh
    # without hashed filenames.
    location ~ ^/(manifest\.webmanifest|favicon\.ico|icon\.svg|icon-\d+x\d+\.png|apple-touch-icon\.png)$ {
        expires 1h;
        add_header Cache-Control                "public, max-age=3600" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"          always;
        add_header Cross-Origin-Embedder-Policy "credentialless"       always;
        add_header Cross-Origin-Resource-Policy "same-origin"          always;
    }

    # Everything else: the Next.js static export emits a per-route
    # `index.html`, so `$uri.html` covers route-level deep links.
    # HTML responses themselves are `no-cache` so a deploy lands
    # immediately for the next navigation.
    location / {
        add_header Cache-Control                "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"               always;
        add_header Cross-Origin-Embedder-Policy "credentialless"            always;
        add_header Cross-Origin-Resource-Policy "same-origin"               always;
        add_header X-Content-Type-Options       "nosniff"                   always;
        try_files $uri $uri/ $uri.html $uri/index.html /index.html;
    }
}

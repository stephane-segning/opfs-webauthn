# Example ArgoCD `Application` consuming the opfs-web Helm chart
# from GHCR OCI.
#
# **Not applied by this repo.** Lives in the user's ArgoCD apps
# repo / install. Committed here for reviewability.
#
# Same wiring as the share-backend `Application` (`apps/share-backend/
# helm/argocd-application.example.yaml`): OCI chart source, Image
# Updater pinning signed digests, cosign keyless verification,
# git write-back. The frontend differs only in image name and
# values.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opfs-web
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: >-
      web=ghcr.io/stephane-segning/opfs-web:latest
    argocd-image-updater.argoproj.io/web.update-strategy: digest
    argocd-image-updater.argoproj.io/web.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/web.helm.image-tag: image.tag

    # Image Updater refuses to promote a digest that wasn't signed
    # by THIS repo's deploy-web workflow on `main`.
    argocd-image-updater.argoproj.io/web.signature-type: cosign
    argocd-image-updater.argoproj.io/web.cosign.certificate-oidc-issuer: >-
      https://token.actions.githubusercontent.com
    argocd-image-updater.argoproj.io/web.cosign.certificate-identity-regexp: >-
      ^https://github\.com/stephane-segning/opfs-webauthn/\.github/workflows/deploy-web\.yml@.*$

    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
    argocd-image-updater.argoproj.io/git-credentials: >-
      secret:argocd/opfs-webauthn-deploy
spec:
  project: default
  source:
    repoURL: ghcr.io/stephane-segning/charts
    chart: opfs-web
    targetRevision: 0.1.0
  destination:
    server: https://kubernetes.default.svc
    namespace: opfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

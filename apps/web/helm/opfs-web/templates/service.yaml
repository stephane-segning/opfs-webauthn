apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: {{ include "opfs-web.fullname" . }}
  labels:
    {{- include "opfs-web.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "opfs-web.selectorLabels" . | nindent 8 }}
      annotations:
        autoscaling.knative.dev/minScale: {{ .Values.autoscaling.minScale | quote }}
        autoscaling.knative.dev/maxScale: {{ .Values.autoscaling.maxScale | quote }}
    spec:
      containerConcurrency: {{ .Values.containerConcurrency }}
      timeoutSeconds: {{ .Values.timeoutSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "opfs-web.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http1
              containerPort: 8080
          # Runtime config: the entrypoint script renders this
          # into `/usr/share/nginx/html/config.js` on container
          # start. Empty string keeps the share UI disabled.
          env:
            - name: SHARE_BACKEND_URL
              value: {{ .Values.env.shareBackendUrl | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

[package]
name = "opfs-core"
description = "wasm-bindgen surface that re-exports the opfs-webauthn crates for JS consumers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Disable wasm-opt for now: modern Rust emits bulk-memory ops that the
# homebrew wasm-opt 0.121 in our toolchain rejects without
# `--enable-bulk-memory-opt`. We give up a few percent of code size in
# exchange for a stable build until either binaryen catches up or we
# pin a specific wasm-opt version with the feature flag.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
opfs-crypto = { path = "../crypto" }
opfs-repo = { path = "../repo" }
opfs-share-protocol = { path = "../share-protocol" }
wasm-bindgen = "0.2"
zeroize = { workspace = true }
# `getrandom`'s default backend handles host targets. On
# wasm32-unknown-unknown the "js" feature wires it up to Web Crypto's
# `crypto.getRandomValues`, which is what we want — the DEK and wrap
# nonce are generated inside wasm so they never appear as JS-visible
# byte buffers (ADR 0005).
getrandom = { version = "0.2", features = ["js"] }
# Share-flow seal/open in `opfs_crypto::share` takes an `RngCore +
# CryptoRng`; pulling rand_core's `getrandom` feature gives us
# `OsRng`, which routes through the same Web Crypto entropy source.
rand_core = { workspace = true, features = ["getrandom"] }

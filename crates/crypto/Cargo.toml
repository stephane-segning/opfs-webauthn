[package]
name = "opfs-crypto"
description = "AES-256-GCM row codec, HKDF-SHA-256 KEK derivation, X25519 share, and BLAKE3 commitment codes — primitives for the opfs-webauthn local-first vault."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["webauthn", "encryption", "aes-gcm", "hkdf", "x25519"]
# Slugs from https://crates.io/category_slugs — max 5, must be exact.
categories = ["cryptography", "no-std"]

[lints]
workspace = true

[dependencies]
aes-gcm = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
rand_core = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
base32 = { workspace = true }
x25519-dalek = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hex-literal = { workspace = true }
hex = { workspace = true }
# Pull `OsRng` in for tests only — production callers must supply
# their own RNG (the WASM build wires `OsRng` via `getrandom`'s
# `js` feature in `crates/core`, not here).
rand_core = { workspace = true, features = ["getrandom"] }

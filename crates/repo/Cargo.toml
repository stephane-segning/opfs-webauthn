[package]
name = "opfs-repo"
description = "SQL schema, migrations, and encrypted row codec for the opfs-webauthn notes vault."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["webauthn", "encryption", "sqlite", "vault", "local-first"]
categories = ["cryptography", "database"]

[lints]
workspace = true

[dependencies]
# Workspace-managed `version + path` — single source of truth
# in the root Cargo.toml's `[workspace.dependencies]`. Avoids
# the hard-coded `0.1.0` drift codex flagged on PR #40.
opfs-crypto = { workspace = true }
# `no_std`-compatible error derive. The crate's only error type
# is `id::Error` for row-id codec failures; future modules may
# add their own variants.
thiserror = { workspace = true }

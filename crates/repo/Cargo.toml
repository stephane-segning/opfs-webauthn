[package]
name = "opfs-repo"
description = "SQL schema, migrations, and encrypted row codec for the opfs-webauthn notes vault."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["webauthn", "encryption", "sqlite", "vault", "local-first"]
categories = ["cryptography", "database"]

[lints]
workspace = true

[dependencies]
# Dual `path` + `version` so `cargo publish` works against
# crates.io while local builds use the workspace source.
opfs-crypto = { path = "../crypto", version = "0.1.0" }
serde = { workspace = true }
serde_bytes = { workspace = true }
ciborium = { workspace = true }
thiserror = { workspace = true }

[package]
name = "opfs-share-protocol"
description = "CBOR envelope types for the recipient-first rendezvous share flow (ADR 0007)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["webauthn", "share", "rendezvous", "cbor", "x25519"]
categories = ["cryptography", "encoding"]

[lints]
workspace = true

[dependencies]
# Workspace-managed `version + path` so bumps to opfs-crypto only
# need editing one entry in the root Cargo.toml's
# `[workspace.dependencies]`. Without `workspace = true`, the
# version would be hard-coded here and silently drift away from
# the actual crate version on a bump.
opfs-crypto = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
ciborium = { workspace = true }
thiserror = { workspace = true }

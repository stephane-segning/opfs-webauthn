# Traefik IngressRoute — same-origin routing for opfs-webauthn
# (ADR 0014).
#
# Topology this manifest assumes:
#
#   * Traefik v3.6+ installed with the experimental Knative
#     provider enabled (`experimental: knative: true`,
#     `providers.knative.enabled: true`).
#   * Knative's `config-network` patched to
#     `ingress.class: traefik.ingress.networking.knative.dev`
#     so Traefik IS the Knative networking layer (no Kourier in
#     the picture).
#   * Two Knative Services in namespace `opfs`: `opfs-web` and
#     `opfs-share-backend`.
#
# Knative does NOT natively support path-based routing of two
# Knative Services on one host (see knative/serving#12588 —
# DomainMapping is strictly 1:1). The pattern below is the
# canonical workaround:
#
#   1. Let the Knative provider keep watching Knative's internal
#      `Ingress` CRDs and producing the routes for the
#      cluster-local hostnames (`<ksvc>.<ns>.<domain-suffix>`).
#      Those stay available for direct testing and won't conflict
#      with the public host.
#   2. Add this `IngressRoute` on the public host
#      (`ocs.vaam.store`). Forward each path branch directly to
#      the KSvc's **Knative-created Kubernetes Service** in the
#      `opfs` namespace.
#
# Why "directly to the KSvc's Service" works end-to-end including
# scale-to-zero: every Knative Service has a *public* K8s Service
# whose endpoints are managed by Knative's SKS reconciler. When
# the KSvc is warm, those endpoints point at Revision pods. When
# it scales to zero, SKS flips to Proxy mode and the endpoints
# become Activator addresses, which scale the KSvc back up on
# the next request. The ingress source doesn't matter — Traefik
# targeting `Service: opfs-web` in `opfs` inherits the same
# activation path the Knative-managed routes do.
#
# So we don't need a Kourier reference (Traefik replaced it) and
# we don't need a `Host` header rewrite (we're targeting the
# K8s Service by name, not Knative's hostname-based routing).
#
# Refs:
#   * https://traefik.io/blog/scale-serverless-workloads-with-traefik-and-knative
#   * https://github.com/knative/serving/blob/main/docs/scaling/SYSTEM.md
#   * https://github.com/knative/serving/issues/12588

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: opfs-webauthn
  namespace: opfs
spec:
  entryPoints:
    # `websecure` is Traefik's conventional :443 entrypoint.
    # Rename if your install uses something else.
    - websecure
  routes:
    # `/api/*` matches first. Explicit `priority` removes any
    # ambiguity about whose rule wins when both could match —
    # longer-PathPrefix wins by default, but spelling it out
    # costs nothing.
    - match: Host(`ocs.vaam.store`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        # Knative auto-creates this K8s Service in `opfs` when
        # the `opfs-share-backend` KSvc is reconciled. Its
        # endpoints are SKS-managed (Activator when cold,
        # Revision pods when warm) — Traefik does NOT need to
        # know which mode it's in.
        - name: opfs-share-backend
          port: 80
      middlewares:
        - name: opfs-api-stripprefix
    # Catch-all → static frontend. Lower priority so `/api/*`
    # always wins above.
    - match: Host(`ocs.vaam.store`)
      kind: Rule
      priority: 10
      services:
        - name: opfs-web
          port: 80
  tls:
    # Hook into your cert-manager / Traefik ACME setup. The
    # ingress terminates TLS here; the path to the KSvc Service
    # inside the cluster is plain HTTP.
    certResolver: letsencrypt
---
# Strip the `/api` mount point so the backend's routes
# (`/rendezvous`, `/rendezvous/:code`, …) stay prefix-free. The
# rendezvous backend doesn't know it's mounted at `/api`; moving
# it later (`/v1/api`, `/share`, …) only touches this manifest.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: opfs-api-stripprefix
  namespace: opfs
spec:
  stripPrefix:
    prefixes:
      - /api
